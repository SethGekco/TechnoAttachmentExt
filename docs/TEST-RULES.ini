; ============================================================================
; TechnoAttachmentExt — paste-in test configuration
; ============================================================================
;
; Grounded in your actual rulesmd: hosts are ALTNK and the ROBO-powered building,
; the child is DRONEDUMMY2, and the prerequisite building is GAROBO. Nothing here
; invents a type you would have to create art for.
;
; NOTE BEFORE YOU START: as of writing, every Attachment0.Type= line in your
; rulesmd is commented out, so no host currently has any attachment at all. Each
; test below therefore gives you the WHOLE block, host slot included.
;
; HOW TO USE
;   1. Add the AttachmentTypes entries (§0) — indices 4+ are free in your list.
;   2. Paste ONE test's [AttachmentType] section near [DroneAttachment] (~35811).
;   3. Paste that test's host block into the host's section.
;   4. Run it, check "LOOK FOR", then comment it out before the next test.
;
; One at a time. Several of these change the same host, and a surprise is only
; informative when one thing changed.
;
; Tests are ordered by what unblocks the most work, not by feature order.
; ============================================================================


; ============================================================================
; §0 — AttachmentTypes registry. Add these once.
; ============================================================================
; [AttachmentTypes]
; 4=T_Sell
; 5=T_Orbit
; 6=T_SaveLoad
; 7=T_Visible
; 8=T_Splash
; 9=T_Intercept
; 10=T_Spawn
; 11=T_Seq
; 12=T_Leash


; ============================================================================
; TEST 1 — Selling must not detonate attachments   [the bug you reported]
; ============================================================================
[T_Sell]
; SoldAction now defaults to vanish, so this tests the DEFAULT. Set it to kill to
; confirm the old behaviour is still reachable.
;SoldAction=kill

; --- host: the ROBO-powered building (~line 13715) ---
; Attachment0.Type=T_Sell
; Attachment0.TechnoType=DRONEDUMMY2
; Attachment0.FLH=0,0,120
;
; LOOK FOR: sell the building. The drone should VANISH SILENTLY — no explosion,
; no debris. Then try SoldAction=kill and confirm it does explode, which proves
; the tag is being read rather than the path simply being dead.


; ============================================================================
; TEST 2 — Orbit, FLH and travel-facing        [three fixes, never confirmed]
; ============================================================================
[T_Orbit]
Spins=yes
Spins.Period=128
Spins.Orbit=yes
Facing.Mode=travel
Spins.Orbit.XScale=130      ; ellipse, so the orbit shape is obvious
Spins.Orbit.YScale=80
Spins.Orbit.Wobble=15
Spins.Orbit.Wobble.Period=200

; --- host: ALTNK ---
; Attachment0.Type=T_Orbit
; Attachment0.TechnoType=DRONEDUMMY2
; Attachment0.FLH=-225,0,90
;
; LOOK FOR, in order — these were three separate bugs and any can still be wrong:
;   a) the drone sits at the FLH OFFSET, not on the tank's centre
;   b) it ORBITS rather than sitting still
;   c) it points ALONG its path, not backwards
;   d) the path is a visible oval that breathes, not a plain circle
; If (a) or (b) fail, the zeroed-scale bug is back. If (c) fails, the mirror fix
; is wrong. Add Spins.Orbit.Reverse=yes to check direction control separately.


; ============================================================================
; TEST 3 — Save/load                       [TIER 0 — blocks simplifying code]
; ============================================================================
[T_SaveLoad]
RespawnDelay=150            ; so there is a timer mid-count to restore

; --- host: ALTNK ---
; Attachment0.Type=T_SaveLoad
; Attachment0.TechnoType=DRONEDUMMY2
; Attachment0.FLH=-225,0,90
;
; LOOK FOR: build the tank, save, reload. The attachment must be
;   PRESENT, exactly ONE of it, and still following the host.
; Report which of these you get, because each points somewhere different:
;   duplicated → Init re-ran and built fresh slots before the stream was read
;   orphaned   → re-linked but the parent pointer did not restore
;   absent     → the restore never ran at all
; The restore currently handles all three defensively; knowing the real one lets
; that become a targeted fix.
;
; SECOND PASS: kill the drone, save DURING the 150-frame respawn wait, reload.
; The timer should resume mid-count, not restart.


; ============================================================================
; TEST 4 — Per-viewer visibility                              [brand new]
; ============================================================================
[T_Visible]
HiddenFrom=enemy

; --- host: ALTNK ---
; Attachment0.Type=T_Visible
; Attachment0.TechnoType=DRONEDUMMY2
; Attachment0.FLH=-225,0,90
;
; LOOK FOR: you see the drone on your own tank. In a skirmish, an enemy-owned
; ALTNK should show NO drone.
;
; THE IMPORTANT ONE: shoot the enemy tank's invisible drone's position — or just
; kill the tank. The hidden drone must still take damage and die normally. If it
; is invulnerable or unhittable, the render-only rule has been broken and that is
; a genuine bug, not a quirk.
;
; Try VisibleTo=owner instead: allies should then lose sight of it too.


; ============================================================================
; TEST 5 — Splash onto relatives                              [brand new]
; ============================================================================
[T_Splash]
; no attachment-side config needed; the warhead drives it

; --- warhead: pick one your tanks actually fire, e.g. [120mm] ---
; SplashToRelatives=children
; SplashToRelatives.Percent=50
; SplashToRelatives.MinDamage=5
;
; --- host: ALTNK ---
; Attachment0.Type=T_Splash
; Attachment0.TechnoType=DRONEDUMMY2
; Attachment0.FLH=-225,0,90
;
; LOOK FOR: shoot the HOST. The host takes damage AND the drone loses health too.
;
; THE POINT OF THE FEATURE: set LegalTarget=no on DRONEDUMMY2 and repeat. Splash
; must STILL reach it — that is the case Intercepts.Parent structurally cannot
; cover, and the only reason both features exist. If it stops working, splash has
; inherited interception's limitation and one of them is redundant.


; ============================================================================
; TEST 6 — Interception                                       [brand new]
; ============================================================================
[T_Intercept]
Intercepts.Parent=yes
Intercepts.Chance=100
Intercepts.Priority=10

; --- host: ALTNK; the child MUST be LegalTarget=yes for this one ---
; Attachment0.Type=T_Intercept
; Attachment0.TechnoType=DRONEDUMMY2
; Attachment0.FLH=-225,0,90
;
; LOOK FOR: shoot the host. The PLATE takes the damage, the hull does not.
;
; THE NEGATIVE CASE, and please do run it: set LegalTarget=no on DRONEDUMMY2.
; Interception must be SKIPPED and the HOST must take damage normally. If the
; host becomes invulnerable instead, the legality gate has failed — that is the
; failure mode the gate exists to prevent.


; ============================================================================
; TEST 7 — Instant spawn on death, but NOT on sale
; ============================================================================
[T_Spawn]
InstantSpawn=DRONEDUMMY2
InstantSpawn.On=destroyed
InstantSpawn.Count=2
InstantSpawn.OnBlocked=nearest
InstantSpawn.Anim.Dest=SMOKEY

; --- host: ALTNK ---
; Attachment0.Type=T_Spawn
; Attachment0.TechnoType=DRONEDUMMY2
; Attachment0.FLH=-225,0,90
;
; LOOK FOR: kill the tank in combat → two drones appear with smoke.
; THEN: sell/undeploy an equivalent host → NOTHING should spawn. `destroyed`
; means killed-by-damage only, and that distinction is the whole design.
;
; Also try InstantSpawn.On.Reason=sold — it should LOG "not implemented yet"
; rather than silently doing nothing.


; ============================================================================
; TEST 8 — Sequence.Force, and the death-animation guard
; ============================================================================
[T_Seq]
Sequence.Force=Ready

; --- host: ALTNK, child must be INFANTRY; use a real infantry type e.g. E1 ---
; Attachment0.Type=T_Seq
; Attachment0.TechnoType=E1
; Attachment0.FLH=0,150,0
;
; LOOK FOR: drive the tank. The rider must NOT play the walk animation.
;
; THEN KILL THE RIDER: it must play its DEATH animation, not freeze standing to
; attention. That guard is the non-obvious half of the feature.


; ============================================================================
; TEST 9 — Leash mode on a BUILDING host    [TIER 0 — historic freeze risk]
; ============================================================================
[T_Leash]
Motion=leashed
Leash.Range=512

; --- host: the ROBO-powered building (~13715) ---
; Attachment0.Type=T_Leash
; Attachment0.TechnoType=DRONEDUMMY2
; Attachment0.FLH=0,0,0
;
; LOOK FOR: the drone moves under its own power and is recalled when it strays
; past two cells.
;
; THE REASON THIS IS TIER 0: the historic building-host freeze came from exactly
; this class of interaction — a child being told to relocate. Play a few minutes
; with this active and watch for a hang. If it freezes, say so immediately; that
; result decides whether leash mode can be used on buildings at all.


; ============================================================================
; TEST 10 — Gunner host profile              [TIER 0 — may oscillate]
; ============================================================================
; Needs a second VehicleType as the profile. Copy your IFV to IFV_TEST and give
; it a different Strength and Primary so the swap is unmistakable. Passengers=
; and SizeLimit= MUST be >= the base type's, or the load-time validator rejects
; the rule (check the log — it names the reason).
;
; --- host: your IFV ---
; GunnerProfile=IFV_TEST
; GunnerProfile.Passenger=E1
; GunnerProfile.MinDwell=15
;
; LOOK FOR: load an E1. The IFV becomes IFV_TEST — different Strength, different
; weapon — AND THE E1 STAYS ABOARD. Unload: it reverts.
;
; THE FAILURE TO WATCH FOR: if the conversion ejects the passenger, the host will
; convert and revert every 15 frames — a visible stutter, not a crash. If you see
; that, report it. Do NOT lower MinDwell; that just makes it a faster freeze.
;
; Also confirm in the log: "GunnerProfile validation: N accepted, M rejected".
; If that line is absent, the rules were never read and nothing below it is valid.


; ============================================================================
; Quick log reference — what should appear
; ============================================================================
; [TAExt] GunnerProfile validation: N accepted, M rejected
; [TAExt] SplashToRelatives: N warhead(s) configured
; [TAExt] prereq <name>: UNMET -> hiding / met -> showing
; [TAExt] gates: <TYPE> DARKENED ... / revived
; [TAExt] converted <A> -> <B>
;
; A missing line is as informative as a wrong one: it means the feature never
; reached the point of having an opinion.
